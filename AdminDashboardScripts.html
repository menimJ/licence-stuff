<script>
const APPLICATIONS_PAGE_SIZE = 20;

      const applicationsState = {
        page: 1,
        search: '',
        status: ''
      };

      let dashboardCurrentApplicationId_ = '';

      function escapeDashboardHtml_(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function statusClass_(value) {
        const text = String(value || '').toLowerCase();

        if (
          text.indexOf('approved') !== -1 ||
          text.indexOf('confirmed') !== -1 ||
          text.indexOf('verified') !== -1 ||
          text.indexOf('released') !== -1
        ) return 'success';

        if (
          text.indexOf('reject') !== -1 ||
          text.indexOf('correction required') !== -1 ||
          text.indexOf('revoked') !== -1 ||
          text.indexOf('suspend') !== -1
        ) return 'danger';

        if (
          text.indexOf('pending') !== -1 ||
          text.indexOf('generated') !== -1
        ) return 'warning';

        return '';
      }

      function renderStatusPill_(value) {
        const text = String(value || 'Not Available');

        return '<span class="status-pill ' +
          statusClass_(text) + '">' +
          escapeDashboardHtml_(text) +
          '</span>';
      }

      function formatDashboardPaymentAmount_(value) {
        const text = String(value || '').trim();
        const numeric = Number(text.replace(/[^0-9.]/g, ''));

        if (!text) {
          return '₦250,000';
        }

        if (isNaN(numeric)) {
          return text;
        }

        return new Intl.NumberFormat('en-NG', {
          style: 'currency',
          currency: 'NGN',
          maximumFractionDigits: 0
        }).format(numeric);
      }

      function applyApplicationFilters() {
        const search = document.getElementById('applicationsSearch');
        const status = document.getElementById('applicationsStatus');

        applicationsState.search = search ? search.value.trim() : '';
        applicationsState.status = status ? status.value : '';
        applicationsState.page = 1;

        loadApplicationsPage();
      }

      function loadApplicationsPage(page) {
        const loading = document.getElementById('applicationsLoading');
        if (!loading) return;

        if (page) applicationsState.page = page;

        const tableArea = document.getElementById('applicationsTableArea');
        const empty = document.getElementById('applicationsEmpty');
        const pagination = document.getElementById('applicationsPagination');

        loading.style.display = 'block';
        loading.textContent = 'Loading applications...';
        if (tableArea) tableArea.style.display = 'none';
        if (empty) empty.style.display = 'none';
        if (pagination) pagination.style.display = 'none';

        google.script.run
          .withSuccessHandler(renderApplicationsPage_)
          .withFailureHandler(function(error) {
            loading.style.display = 'block';
            loading.textContent = getErrorMessage_(error);
          })
          .getAdminApplicationsPage(
            ADMIN_SESSION_TOKEN,
            {
              page: applicationsState.page,
              pageSize: APPLICATIONS_PAGE_SIZE,
              search: applicationsState.search,
              status: applicationsState.status
            }
          );
      }

      function renderApplicationsPage_(result) {
        const loading = document.getElementById('applicationsLoading');
        const empty = document.getElementById('applicationsEmpty');
        const tableArea = document.getElementById('applicationsTableArea');
        const tableBody = document.getElementById('applicationsTableBody');
        const count = document.getElementById('applicationsCount');
        const pagination = document.getElementById('applicationsPagination');
        const pageSummary = document.getElementById('applicationsPageSummary');

        if (loading) loading.style.display = 'none';

        if (!result || result.ok !== true) {
          if (empty) {
            empty.style.display = 'block';
            empty.textContent =
              result && result.message
                ? result.message
                : 'Unable to load applications.';
          }
          return;
        }

        applicationsState.page = Number(result.page || 1);

        const items = Array.isArray(result.items)
          ? result.items
          : [];

        const totalItems = Number(result.totalItems || 0);

        if (count) {
          count.textContent =
            totalItems === 1
              ? '1 application'
              : totalItems + ' applications';
        }

        if (!items.length) {
          if (tableArea) tableArea.style.display = 'none';
          if (pagination) pagination.style.display = 'none';

          if (empty) {
            empty.style.display = 'block';
            empty.textContent =
              result.message || 'No applications found.';
          }
          return;
        }

        if (empty) empty.style.display = 'none';

        tableBody.innerHTML = items.map(function(application) {
          const applicationId =
            String(application.applicationId || '');

          const reviewUrl =
            ADMIN_DASHBOARD_BASE_URL +
            '?view=dashboard&section=applications' +
            '&applicationId=' +
            encodeURIComponent(applicationId) +
            '&session=' +
            encodeURIComponent(ADMIN_SESSION_TOKEN);

          return (
            '<tr>' +
              '<td><div class="application-primary">' +
                escapeDashboardHtml_(applicationId) +
              '</div></td>' +
              '<td><div class="application-primary">' +
                escapeDashboardHtml_(
                  application.applicantName || 'Applicant'
                ) +
              '</div></td>' +
              '<td>' +
                escapeDashboardHtml_(
                  application.companyName || '—'
                ) +
              '</td>' +
              '<td>' +
                renderStatusPill_(application.informationStatus) +
              '</td>' +
              '<td>' +
                renderStatusPill_(application.documentStatus) +
              '</td>' +
              '<td>' +
                renderStatusPill_(application.verificationStatus) +
              '</td>' +
              '<td>' +
                escapeDashboardHtml_(
                  application.submittedAt || '—'
                ) +
              '</td>' +
              '<td><a class="review-link" href="' +
                escapeDashboardHtml_(reviewUrl) +
              '">Review</a></td>' +
            '</tr>'
          );
        }).join('');

        if (tableArea) tableArea.style.display = 'block';

        if (pageSummary) {
          const start =
            (applicationsState.page - 1) *
            APPLICATIONS_PAGE_SIZE + 1;

          const end = Math.min(
            start + items.length - 1,
            totalItems
          );

          pageSummary.textContent =
            'Showing ' + start + '–' + end +
            ' of ' + totalItems;
        }

        renderApplicationPagination_(
          Number(result.page || 1),
          Number(result.totalPages || 1),
          Boolean(result.hasPrevious),
          Boolean(result.hasNext)
        );

        if (pagination) pagination.style.display = 'flex';
      }

      function renderApplicationPagination_(
        page,
        totalPages,
        hasPrevious,
        hasNext
      ) {
        const container =
          document.getElementById('applicationsPageButtons');

        if (!container) return;

        const parts = [];

        parts.push(
          '<button class="page-button" type="button" ' +
          (hasPrevious
            ? 'onclick="loadApplicationsPage(' +
              (page - 1) + ')"'
            : 'disabled') +
          '>Previous</button>'
        );

        const start = Math.max(1, page - 2);
        const end = Math.min(totalPages, page + 2);

        for (let i = start; i <= end; i++) {
          parts.push(
            '<button class="page-button ' +
            (i === page ? 'active' : '') +
            '" type="button" ' +
            (i === page
              ? 'disabled'
              : 'onclick="loadApplicationsPage(' +
                i + ')"') +
            '>' + i + '</button>'
          );
        }

        parts.push(
          '<button class="page-button" type="button" ' +
          (hasNext
            ? 'onclick="loadApplicationsPage(' +
              (page + 1) + ')"'
            : 'disabled') +
          '>Next</button>'
        );

        container.innerHTML = parts.join('');
      }

      function setDashboardDetailText_(id, value) {
        const element = document.getElementById(id);

        if (!element) {
          return;
        }

        element.textContent =
          String(value || '').trim() ||
          '—';
      }

      function getDashboardDocumentUrl_(
        applicationId,
        documentType,
        action
      ) {
        return (
          ADMIN_DASHBOARD_BASE_URL +
          '?view=admindocument' +
          '&applicationId=' +
          encodeURIComponent(applicationId) +
          '&documentType=' +
          encodeURIComponent(documentType) +
          '&action=' +
          encodeURIComponent(action || 'view') +
          '&session=' +
          encodeURIComponent(ADMIN_SESSION_TOKEN)
        );
      }

      function renderDashboardDocuments_(
        applicationId,
        documents,
        overallDocumentStatus,
        containerId
      ) {
        const container =
          document.getElementById(
            containerId ||
            'dashboardDocuments'
          );

        if (!container) {
          return;
        }

        const items =
          Array.isArray(documents)
            ? documents
            : [];

        if (!items.length) {
          container.innerHTML =
            '<div class="applications-state">' +
              'No supporting documents have been submitted.' +
            '</div>';
          return;
        }

        container.innerHTML =
          items.map(function(document) {
            const viewUrl =
              getDashboardDocumentUrl_(
                applicationId,
                document.type,
                'view'
              );

            const downloadUrl =
              getDashboardDocumentUrl_(
                applicationId,
                document.type,
                'download'
              );

            const status =
              document.reviewStatus ||
              (document.uploaded ? 'Pending Review' : 'Not Submitted');

            const canReview =
              document.uploaded === true &&
              String(overallDocumentStatus || '').toLowerCase() !== 'complete' &&
              ['approved', 'correction required'].indexOf(
                String(status).toLowerCase()
              ) === -1;

            const note =
              document.reviewNotes
                ? '<div class="dashboard-review-note"><strong>Review note:</strong> ' +
                  escapeDashboardHtml_(document.reviewNotes) +
                  '</div>'
                : '';

            const reviewed =
              document.reviewedAt
                ? '<div class="muted">Reviewed: ' +
                  escapeDashboardHtml_(document.reviewedAt) +
                  (document.reviewedBy
                    ? ' • ' + escapeDashboardHtml_(document.reviewedBy)
                    : '') +
                  '</div>'
                : '';

            const reviewActions =
              canReview
                ? '<div class="dashboard-doc-actions dashboard-document-review-actions">' +
                  '<button class="button" type="button" onclick="reviewDashboardDocument_(\'' +
                  escapeDashboardHtml_(document.type) +
                  '\', \'approve\')">Approve</button>' +
                  '<button class="button button-danger" type="button" onclick="reviewDashboardDocument_(\'' +
                  escapeDashboardHtml_(document.type) +
                  '\', \'correction\')">Request Correction</button>' +
                  '</div>'
                : '';

            return (
              '<div class="dashboard-doc-row">' +
                '<div>' +
                  '<strong>' +
                    escapeDashboardHtml_(
                      document.label ||
                      document.type
                    ) +
                  '</strong>' +
                  '<div class="dashboard-document-status">' +
                    renderStatusPill_(status) +
                  '</div>' +
                  (document.uploadedAt
                    ? '<div class="muted">Uploaded: ' +
                      escapeDashboardHtml_(document.uploadedAt) +
                      '</div>'
                    : '') +
                  reviewed +
                  note +
                '</div>' +
                '<div class="dashboard-doc-actions">' +
                  (document.uploaded
                    ? '<a class="dashboard-detail-link" target="_blank" href="' +
                      escapeDashboardHtml_(viewUrl) +
                      '">View</a>' +
                      '<a class="dashboard-detail-link" target="_blank" href="' +
                      escapeDashboardHtml_(downloadUrl) +
                      '">Download</a>'
                    : '') +
                  reviewActions +
                '</div>' +
              '</div>'
            );
          }).join('');
      }

      const DASHBOARD_DOCUMENT_CORRECTION_REASONS = {
        cac: ['CAC document is unclear or unreadable', 'Incorrect CAC document was uploaded', 'CAC document is incomplete or has missing pages', 'CAC details do not match the application', 'Other'],
        passport: ['Passport photograph is unclear or poor quality', 'Photograph does not appear to be for the Director or Company Owner', 'Uploaded file is not an acceptable passport photograph', 'Photograph details do not match the application', 'Other'],
        education: ['Educational certificate is unclear or unreadable', 'Incorrect educational certificate was uploaded', 'Educational certificate submission is incomplete', 'Certificate details do not match the application', 'Other'],
        experience: ['CV / proof of experience is unclear or unreadable', 'Incorrect proof of experience was uploaded', 'CV / proof of experience is incomplete', 'CV is not for the CEO / required responsible person', 'Experience details do not match the application', 'Other'],
        identification: ['Means of identification is unclear or unreadable', 'Incorrect means of identification was uploaded', 'Identification document is incomplete', 'Identification details do not match the application', 'Other']
      };

      const DASHBOARD_INFORMATION_TARGETS = [
        ['full_name', 'Full Name'],
        ['gender', 'Gender'],
        ['date_of_birth', 'Date of Birth'],
        ['nationality', 'Nationality'],
        ['state_of_origin', 'State of Origin'],
        ['residential_address', 'Residential Address'],
        ['phone_number', 'Phone Number'],
        ['email_address', 'Email Address'],
        ['means_of_identification', 'Means of Identification'],
        ['id_number', 'ID Number'],

        ['area_of_practice', 'Area of Practice'],
        ['other_area_of_practice', 'If Other, please specify'],
        ['company_name', 'Company Name'],
        ['company_rc_number', 'Company RC Number'],
        ['company_tin', 'Company TIN'],
        ['crffn_membership_number', 'CRFFN Membership Number'],
        ['company_address', 'Company Address'],
        ['position_held', 'Position Held'],

        ['other', 'Other Application Information']
      ];

      const DASHBOARD_INFORMATION_ISSUES = [
        ['incomplete', 'is incomplete'], ['incorrect', 'requires correction'], ['mismatch', 'does not match the submitted records'], ['invalid', 'appears invalid'], ['missing', 'is missing'], ['other', 'has another issue']
      ];

      let dashboardReviewAction_ = null;
      let dashboardReviewBusy_ = false;

      function closeDashboardReviewDialog_() {
        const dialog = document.getElementById('dashboardReviewDialog');
        if (dialog) { dialog.style.display = 'none'; }
        dashboardReviewAction_ = null;
        dashboardReviewBusy_ = false;
      }

      function setDashboardReviewBusy_(busy, text) {
        const confirm = document.getElementById('dashboardReviewConfirm');
        const cancel = document.querySelector('#dashboardReviewDialog [onclick="closeDashboardReviewDialog_()"]');
        dashboardReviewBusy_ = busy;
        if (confirm) {
          confirm.disabled = busy;
          if (text) { confirm.textContent = text; }
        }
        if (cancel) { cancel.disabled = busy; }
      }

      function completeDashboardReviewSuccess_(message, refresh) {
        const messageElement = document.getElementById('dashboardReviewDialogMessage');
        const confirm = document.getElementById('dashboardReviewConfirm');
        setDashboardReviewBusy_(true, message || 'Approved successfully');
        if (messageElement) { messageElement.textContent = message || 'Approved successfully'; }
        if (confirm) { confirm.classList.remove('button-danger'); }
        window.setTimeout(function() {
          closeDashboardReviewDialog_();
          if (refresh) { refreshDashboardApplicationDetail_(); }
        }, 500);
      }

      function showDashboardReviewError_(message, confirmText) {
        const messageElement = document.getElementById('dashboardReviewDialogMessage');
        setDashboardReviewBusy_(false, confirmText || 'Try Again');
        if (messageElement) { messageElement.textContent = message || 'The action could not be completed.'; }
      }

      function populateDashboardReviewSelect_(select, options, placeholder) {
        select.innerHTML = '<option value="">' + placeholder + '</option>';
        options.forEach(function(option) {
          const value = Array.isArray(option) ? option[0] : option;
          const label = Array.isArray(option) ? option[1] : option;
          select.innerHTML += '<option value="' + escapeDashboardHtml_(value) + '">' + escapeDashboardHtml_(label) + '</option>';
        });
      }

      function updateDashboardCorrectionDetailsVisibility_() {
        const rows = Array.from(document.querySelectorAll('#dashboardReviewRows .dashboard-correction-row'));
        const needsDetails = rows.some(function(row) {
          return row.querySelector('.dashboard-correction-target').value === 'other' || row.querySelector('.dashboard-correction-issue').value === 'other';
        });
        const detailsLabel = document.getElementById('dashboardReviewDetailsLabel');
        if (detailsLabel) { detailsLabel.style.display = needsDetails ? 'grid' : 'none'; }
      }

      function addDashboardInformationCorrectionRow_() {
        const list = document.getElementById('dashboardReviewRows');
        if (!list) { return; }
        const row = document.createElement('div');
        row.className = 'dashboard-correction-row';
        row.innerHTML = '<label>Field<select class="dashboard-correction-target"></select></label><label>Issue<select class="dashboard-correction-issue"></select></label><button class="dashboard-remove-correction" type="button">Remove</button>';
        const target = row.querySelector('.dashboard-correction-target');
        const issue = row.querySelector('.dashboard-correction-issue');
        populateDashboardReviewSelect_(target, DASHBOARD_INFORMATION_TARGETS, 'Select field');
        populateDashboardReviewSelect_(issue, DASHBOARD_INFORMATION_ISSUES, 'Select issue');
        target.onchange = updateDashboardCorrectionDetailsVisibility_;
        issue.onchange = updateDashboardCorrectionDetailsVisibility_;
        row.querySelector('.dashboard-remove-correction').onclick = function() {
          if (list.children.length === 1) {
            target.value = '';
            issue.value = '';
          } else {
            row.remove();
          }
          updateDashboardCorrectionDetailsVisibility_();
        };
        list.appendChild(row);
      }

      function getDashboardInformationCorrectionPayload_() {
        const rows = Array.from(document.querySelectorAll('#dashboardReviewRows .dashboard-correction-row'));
        const correctionItems = [];
        for (const row of rows) {
          const targetCode = row.querySelector('.dashboard-correction-target').value;
          const issueCode = row.querySelector('.dashboard-correction-issue').value;
          if (!targetCode || !issueCode) {
            throw new Error('Select both the field and issue for every correction.');
          }
          correctionItems.push({
            targetCode: targetCode,
            targetLabel: getDashboardInformationTargetLabel_(targetCode),
            issueCode: issueCode,
            issueText: getDashboardCorrectionIssueText_(issueCode)
          });
        }
        if (!correctionItems.length) {
          throw new Error('Add at least one correction.');
        }
        const details = String(document.getElementById('dashboardReviewDetails').value || '').trim();
        if (correctionItems.some(function(item) { return item.targetCode === 'other' || item.issueCode === 'other'; }) && !details) {
          throw new Error('Enter the specific custom reason for the item marked Other.');
        }
        return { correctionItems: correctionItems, details: details };
      }

      function showDashboardReviewDialog_(config) {
        const dialog = document.getElementById('dashboardReviewDialog');
        const title = document.getElementById('dashboardReviewDialogTitle');
        const message = document.getElementById('dashboardReviewDialogMessage');
        const targetLabel = document.getElementById('dashboardReviewTargetLabel');
        const target = document.getElementById('dashboardReviewTarget');
        const reasonLabel = document.getElementById('dashboardReviewReasonLabel');
        const reason = document.getElementById('dashboardReviewReason');
        const detailsLabel = document.getElementById('dashboardReviewDetailsLabel');
        const details = document.getElementById('dashboardReviewDetails');
        const confirm = document.getElementById('dashboardReviewConfirm');
        const rowsLabel = document.getElementById('dashboardReviewRowsLabel');
        const rows = document.getElementById('dashboardReviewRows');
        const addRow = document.getElementById('dashboardReviewAddRow');
        if (!dialog || !title || !message || !confirm) { return; }
        title.textContent = config.title;
        message.textContent = config.message;
        details.value = '';
        const multiRows = config.multiRows === true;
        rowsLabel.style.display = multiRows ? 'grid' : 'none';
        targetLabel.style.display = !multiRows && config.targets ? 'grid' : 'none';
        reasonLabel.style.display = !multiRows && config.reasons ? 'grid' : 'none';
        const updateReasonDetailsVisibility = function() {
          detailsLabel.style.display =
            !multiRows && (
              config.showDetails === true ||
              (
                config.detailsWhenOther === true &&
                String(reason.value || '').toLowerCase() === 'other'
              )
            )
              ? 'grid'
              : 'none';
        };
        updateReasonDetailsVisibility();
        if (multiRows) {
          rows.innerHTML = '';
          addRow.onclick = addDashboardInformationCorrectionRow_;
          addDashboardInformationCorrectionRow_();
        }
        if (config.targets) { target.innerHTML = config.targets.map(function(item) { return '<option value="' + escapeDashboardHtml_(item[0]) + '">' + escapeDashboardHtml_(item[1]) + '</option>'; }).join(''); }
        if (config.reasons) {
          reason.innerHTML = config.reasons.map(function(item) {
            const value = Array.isArray(item) ? item[0] : item;
            const label = Array.isArray(item) ? item[1] : item;
            return '<option value="' + escapeDashboardHtml_(value) + '">' + escapeDashboardHtml_(label) + '</option>';
          }).join('');
          reason.onchange = updateReasonDetailsVisibility;
          updateReasonDetailsVisibility();
        } else {
          reason.onchange = null;
        }
        confirm.textContent = config.confirmText;
        confirm.classList.toggle('button-danger', config.type === 'danger');
        setDashboardReviewBusy_(false);
        dashboardReviewAction_ = config.onConfirm;
        confirm.onclick = function() {
          if (dashboardReviewBusy_) { return; }
          try {
            const input = multiRows
              ? getDashboardInformationCorrectionPayload_()
              : { target: target.value, reason: reason.value, details: details.value };
            setDashboardReviewBusy_(true, config.busyText || 'Processing...');
            dashboardReviewAction_(input);
          } catch (error) {
            showDashboardReviewError_(error.message || 'Complete the correction details.', config.confirmText);
          }
        };
        dialog.style.display = 'grid';
      }

      function refreshDashboardApplicationDetail_() {
        if (dashboardCurrentApplicationId_) { loadDashboardApplicationDetail_(dashboardCurrentApplicationId_); }
      }

      function reviewDashboardDocument_(documentType, decision) {
        const submit = function(notes) {
          google.script.run.withSuccessHandler(function(result) {
            if (!result || result.ok !== true) { showDashboardReviewError_(result && result.message ? result.message : 'The document review could not be saved.', decision === 'approve' ? 'Approve Document' : 'Request Correction'); return; }
            completeDashboardReviewSuccess_(decision === 'approve' ? 'Approved successfully' : 'Correction requested successfully', true);
          }).withFailureHandler(function(error) { showDashboardReviewError_(getErrorMessage_(error), decision === 'approve' ? 'Approve Document' : 'Request Correction'); }).reviewSupportingDocument(dashboardCurrentApplicationId_, documentType, decision, notes || '', ADMIN_SESSION_TOKEN);
        };
        if (decision === 'approve') {
          showDashboardReviewDialog_({ title: 'Approve Document', message: 'Approve this supporting document?', confirmText: 'Approve Document', busyText: 'Approving...', showDetails: false, onConfirm: function() { submit(''); } });
          return;
        }
        showDashboardReviewDialog_({ title: 'Request Document Correction', message: 'Select the reason this document requires correction.', reasons: DASHBOARD_DOCUMENT_CORRECTION_REASONS[documentType] || ['Other'], detailsWhenOther: true, confirmText: 'Request Correction', busyText: 'Processing...', type: 'danger', onConfirm: function(input) { const notes = input.reason === 'Other' ? String(input.details || '').trim() : input.reason; if (!notes) { throw new Error('Enter the correction details.'); } submit(notes); } });
      }

      function reviewDashboardInformation_(decision) {
        const submit = function(correctionItems, details) {
          const runner = google.script.run.withSuccessHandler(function(result) {
            if (!result || result.ok !== true) { showDashboardReviewError_(result && result.message ? result.message : 'The information review could not be saved.', decision === 'approve' ? 'Confirm Information' : 'Request Correction'); return; }
            completeDashboardReviewSuccess_(decision === 'approve' ? 'Approved successfully' : 'Correction requested successfully', true);
          }).withFailureHandler(function(error) { showDashboardReviewError_(getErrorMessage_(error), decision === 'approve' ? 'Confirm Information' : 'Request Correction'); });
          if (decision === 'approve') { runner.approveAdminReviewStage(dashboardCurrentApplicationId_, 'information', '', ADMIN_SESSION_TOKEN); }
          else { runner.rejectAdminReviewStage(dashboardCurrentApplicationId_, 'information', correctionItems, details, ADMIN_SESSION_TOKEN); }
        };
        if (decision === 'approve') { showDashboardReviewDialog_({ title: 'Confirm Information', message: 'Confirm the application information?', confirmText: 'Confirm Information', busyText: 'Approving...', showDetails: false, onConfirm: function() { submit([], ''); } }); return; }
        showDashboardReviewDialog_({ title: 'Request Information Correction', message: 'Add every field requiring correction and select its issue.', multiRows: true, confirmText: 'Request Correction', busyText: 'Processing...', type: 'danger', onConfirm: function(input) { submit(input.correctionItems, input.details); } });
      }

      function loadDashboardApplicationDetail_(applicationId) {
        const list =
          document.getElementById(
            'dashboardApplicationsList'
          );

        const detail =
          document.getElementById(
            'dashboardApplicationDetail'
          );

        const loading =
          document.getElementById(
            'dashboardDetailLoading'
          );

        if (!applicationId || !detail) {
          return;
        }

        dashboardCurrentApplicationId_ = applicationId;

        if (list) {
          list.style.display = 'none';
        }

        detail.style.display = 'block';

        google.script.run
          .withSuccessHandler(function(result) {
            if (
              !result ||
              result.ok !== true ||
              !result.application
            ) {
              loading.textContent =
                result && result.message
                  ? result.message
                  : 'Application could not be loaded.';
              return;
            }

            const application =
              result.application;

            loading.style.display = 'none';

            [
              'dashboardDetailContent',
              'dashboardStageOneWorkspace'
            ].forEach(function(id) {
              const section =
                document.getElementById(id);

              if (section) {
                section.style.display = 'block';
              }
            });

            setDashboardDetailText_('detailApplicationId', application.applicationId);
            setDashboardDetailText_('detailApplicationIdField', application.applicationId);
            setDashboardDetailText_(
              'detailSubtitle',
              [application.applicantName, application.companyName]
                .filter(Boolean)
                .join(' • ')
            );

                closeDashboardReviewDialog_();

                showDashboardReviewError_(getErrorMessage_(error), 'Confirm Payment');

      function rejectDashboardPayment_() {
        if (!dashboardCurrentPaymentApplicationId_) { return; }
        showDashboardReviewDialog_({
          title: 'Reject Payment',
          message: 'Select the reason this payment cannot be accepted.',
          reasons: DASHBOARD_PAYMENT_REJECTION_REASONS,
          detailsWhenOther: true,
          confirmText: 'Reject Payment',
          busyText: 'Rejecting...',
          type: 'danger',
          onConfirm: function(input) {
            if (!input.reason) {
              throw new Error('Select a rejection reason.');
            }
            const details = input.reason === 'other'
              ? String(input.details || '').trim()
              : '';
            if (input.reason === 'other' && !details) {
              throw new Error('Enter the rejection reason.');
            }
            google.script.run
              .withSuccessHandler(function(result) {
                if (!result || result.ok !== true) {
                  showDashboardReviewError_(result && result.message ? result.message : 'Payment could not be rejected.', 'Reject Payment');
                  return;
                }
                closeDashboardReviewDialog_();
                setDashboardPaymentActionMessage_(result.message || 'Payment rejected.');
                loadDashboardPaymentDetail_(dashboardCurrentPaymentApplicationId_);
              })
              .withFailureHandler(function(error) {
                showDashboardReviewError_(getErrorMessage_(error), 'Reject Payment');
              })
              .rejectAdminReviewStage(
                dashboardCurrentPaymentApplicationId_,
                'payment',
                [input.reason],
                details,
                ADMIN_SESSION_TOKEN
              );
          }
        });
      }


      let dashboardCurrentLicenceApplicationId_ = '';

      function getDashboardLicenceStatusLabel_(application) {
        const item = application || {};
        const status = String(item.licenceStatus || '')
          .trim()
          .toLowerCase();

        if (status === 'released') {
          return 'Issued';
        }

        if (item.hasStampedLicence || item.stampedLicenceFileId) {
          return 'Stamped Licence Uploaded';
        }

        if (status === 'generated' || item.hasLicenceDraft || item.licencePdfUrl) {
          return 'Draft Generated';
        }

        return 'Awaiting Creation';

          button.textContent = label;

      function loadDashboardLicenceDetail_(applicationId) {
        const list = document.getElementById('dashboardLicencesList');

        const loading = document.getElementById('dashboardLicenceDetailLoading');
        if (!applicationId || !detail || !loading) { return; }

        dashboardCurrentLicenceApplicationId_ = applicationId;

              return;
            }

            const application = result.application;
            const status = String(application.licenceStatus || '').toLowerCase();
            const hasStamped = Boolean(application.stampedLicenceFileId || application.stampedLicencePdfUrl);
            const hasDraft = Boolean(application.licencePdfUrl);
            const released = status === 'released';
            loading.style.display = 'none';
            ['dashboardLicenceDetailContent', 'dashboardLicenceWorkspace', 'dashboardLicenceApplicantInformation'].forEach(function(id) {
              const element = document.getElementById(id);

            setDashboardDetailText_('licenceDetailSubtitle', [application.applicantName, application.companyName].filter(Boolean).join(' • '));
            const statusElement = document.getElementById('licenceDetailStatus');

            setDashboardDetailText_('licenceDetailNumber', application.licenceNumber);
            setDashboardDetailText_('licenceDetailGeneratedAt', application.licenceGeneratedAt);
            setDashboardDetailText_('licenceDetailReleasedAt', application.licenceReleasedAt);
            renderDashboardLicenceInformation_(application);
            renderDashboardDocuments_(application.applicationId || applicationId, application.supportingDocuments, 'Complete', 'licenceDetailDocuments');

            const draftStep = document.getElementById('licenceDetailDraftStep');
            const generateActions = document.getElementById('licenceDetailGenerateActions');
            const uploadPanel = document.getElementById('licenceDetailStampedUpload');
            const stampedActions = document.getElementById('licenceDetailStampedActions');
            if (draftStep) { draftStep.style.display = hasDraft ? 'block' : 'none'; }
            if (generateActions) { generateActions.style.display = !hasDraft && !hasStamped && !released ? 'block' : 'none'; }
            if (uploadPanel) { uploadPanel.style.display = hasDraft && !hasStamped && !released ? 'block' : 'none'; }
            if (stampedActions) { stampedActions.style.display = hasStamped ? 'block' : 'none'; }

            if (hasDraft) {
              document.getElementById('licenceDetailViewDraft').href = getDashboardDocumentUrl_(application.applicationId || applicationId, 'draftlicence', 'view');
              document.getElementById('licenceDetailDownloadDraft').href = getDashboardDocumentUrl_(application.applicationId || applicationId, 'draftlicence', 'download');
            }
            if (hasStamped) {
              document.getElementById('licenceDetailViewStamped').href = getDashboardDocumentUrl_(application.applicationId || applicationId, 'stampedlicence', 'view');
              document.getElementById('licenceDetailDownloadStamped').href = getDashboardDocumentUrl_(application.applicationId || applicationId, 'stampedlicence', 'download');
              const send = document.getElementById('sendDashboardLicenceButton');
              if (send) { send.disabled = released; send.style.display = released ? 'none' : 'inline-flex'; }
            }
          })
          .withFailureHandler(function(error) {
            loading.textContent = getErrorMessage_(error);

          setDashboardLicenceActionMessage_('Select the signed and stamped PDF before uploading.', true);
          return;
        }
        if ((file.type && file.type !== 'application/pdf') && !String(file.name || '').toLowerCase().endsWith('.pdf')) {
          setDashboardLicenceActionMessage_('Only PDF files are allowed.', true);
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          setDashboardLicenceActionMessage_('The stamped licence must not exceed 10 MB.', true);
          return;
        }

        setDashboardLicenceButtonBusy_('uploadDashboardStampedLicenceButton', true, 'Uploading...');
        const reader = new FileReader();
        reader.onload = function(event) {
          const value = String(event.target.result || '');
          const base64Data = value.indexOf(',') === -1 ? value : value.split(',')[1];
          google.script.run
            .withSuccessHandler(function(result) {
              setDashboardLicenceButtonBusy_('uploadDashboardStampedLicenceButton', false);
              if (!result || result.ok !== true) {
                setDashboardLicenceActionMessage_(result && result.message ? result.message : 'The stamped licence could not be uploaded.', true);
                return;
              }
              setDashboardLicenceActionMessage_(result.message || 'Stamped licence uploaded successfully.');
              loadDashboardLicenceDetail_(dashboardCurrentLicenceApplicationId_);
            })
            .withFailureHandler(function(error) {
              setDashboardLicenceButtonBusy_('uploadDashboardStampedLicenceButton', false);
              setDashboardLicenceActionMessage_(getErrorMessage_(error), true);
            })
            .uploadAdminDashboardStampedLicence(ADMIN_SESSION_TOKEN, {
              applicationId: dashboardCurrentLicenceApplicationId_,
              fileName: file.name,
              mimeType: file.type || 'application/pdf',
              base64Data: base64Data
            });
        };
        reader.onerror = function() {
          setDashboardLicenceButtonBusy_('uploadDashboardStampedLicenceButton', false);
          setDashboardLicenceActionMessage_('The selected file could not be read.', true);
        };
        reader.readAsDataURL(file);
      }

      function sendDashboardLicence_() {
        if (!dashboardCurrentLicenceApplicationId_) { return; }
        showDashboardReviewDialog_({
          title: 'Send Licence',
          message: 'Send this stamped licence to the applicant? This will release it in the applicant portal.',
          confirmText: 'Send Licence',
          busyText: 'Sending...',
          showDetails: false,
          onConfirm: function() {
            google.script.run
              .withSuccessHandler(function(result) {
                if (!result || result.ok !== true) {
                  showDashboardReviewError_(result && result.message ? result.message : 'The licence could not be sent.', 'Send Licence');
                  return;
                }
                closeDashboardReviewDialog_();
                setDashboardLicenceActionMessage_(result.message || 'Licence issued and sent successfully.');
                loadDashboardLicenceDetail_(dashboardCurrentLicenceApplicationId_);
              })
              .withFailureHandler(function(error) {
                showDashboardReviewError_(getErrorMessage_(error), 'Send Licence');
              })
              .releaseAdminDashboardLicence(ADMIN_SESSION_TOKEN, dashboardCurrentLicenceApplicationId_);
          }
        });
      }

      function applyLicenceFilters() {
        const search =
          document.getElementById(
            'licencesSearch'
          );

        const status =
          document.getElementById(
            'licencesStatus'
          );

        licencesState.search =
          search
            ? search.value.trim()
            : '';

        licencesState.status =
          status
            ? status.value
            : '';

        licencesState.page = 1;
        loadLicencesPage();
      }


      function loadLicencesPage(page) {
        const loading =
          document.getElementById(
            'licencesLoading'
          );

        if (!loading) {
          return;
        }

        if (page) {
          licencesState.page = page;
        }

        setWorkflowLoading_(
          'licences',
          'Loading licences...'
        );

        google.script.run
          .withSuccessHandler(
            renderLicencesPage_
          )
          .withFailureHandler(function(error) {
            loading.textContent =
              getErrorMessage_(error);
          })
          .getAdminLicencesPage(
            ADMIN_SESSION_TOKEN,
            {
              page: licencesState.page,
              pageSize:
                WORKFLOW_PAGE_SIZE,
              search:
                licencesState.search,
              status:
                licencesState.status
            }
          );
      }


      function renderLicencesPage_(result) {
        renderWorkflowPage_(
          'licences',
          result,
          licencesState,
          function(item) {
            const applicationId =
              String(item.applicationId || '');

            const reviewUrl =
              getDashboardLicenceDetailUrl_(
                applicationId
              );

            return (
              '<tr>' +
                '<td><div class="application-primary">' +
                  escapeDashboardHtml_(
                    item.applicationId ||
                    ''
                  ) +
                '</div></td>' +
                '<td>' +
                  escapeDashboardHtml_(
                    item.applicantName ||
                    'Applicant'
                  ) +
                '</td>' +
                '<td>' +
                  escapeDashboardHtml_(
                    item.companyName ||
                    '—'
                  ) +
                '</td>' +
                '<td>' +
                  escapeDashboardHtml_(
                    item.licenceNumber ||
                    '—'
                  ) +
                '</td>' +
                '<td>' +
                  renderStatusPill_(
                    getDashboardLicenceStatusLabel_(item)
                  ) +
                '</td>' +
                '<td>' +
                  escapeDashboardHtml_(
                    item.licenceGeneratedAt ||
                    '—'
                  ) +
                '</td>' +
                '<td>' +
                  escapeDashboardHtml_(
                    item.licenceReleasedAt ||
                    '—'
                  ) +
                '</td>' +
                '<td><a class="review-link" href="' +
                  escapeDashboardHtml_(reviewUrl) +
                '">Manage</a></td>' +
              '</tr>'
            );
          },
          loadLicencesPage
        );
      }


      function setWorkflowLoading_(
        prefix,
        text
      ) {
        const loading =
          document.getElementById(
            prefix + 'Loading'
          );

        const empty =
          document.getElementById(
            prefix + 'Empty'
          );

        const table =
          document.getElementById(
            prefix + 'TableArea'
          );

        const pagination =
          document.getElementById(
            prefix + 'Pagination'
          );

        if (loading) {
          loading.style.display =
            'block';
          loading.textContent = text;
        }

        if (empty) {
          empty.style.display =
            'none';
        }

        if (table) {
          table.style.display =
            'none';
        }

        if (pagination) {
          pagination.style.display =
            'none';
        }
      }


      function renderWorkflowPage_(
        prefix,
        result,
        state,
        rowRenderer,
        pageLoader
      ) {
        const loading =
          document.getElementById(
            prefix + 'Loading'
          );

        const empty =
          document.getElementById(
            prefix + 'Empty'
          );

        const tableArea =
          document.getElementById(
            prefix + 'TableArea'
          );

        const tableBody =
          document.getElementById(
            prefix + 'TableBody'
          );

        const count =
          document.getElementById(
            prefix + 'Count'
          );

        const pagination =
          document.getElementById(
            prefix + 'Pagination'
          );

        const pageSummary =
          document.getElementById(
            prefix + 'PageSummary'
          );

        if (loading) {
          loading.style.display =
            'none';
        }

        if (
          !result ||
          result.ok !== true
        ) {
          if (empty) {
            empty.style.display =
              'block';
            empty.textContent =
              result &&
              result.message
                ? result.message
                : 'Unable to load records.';
          }
          return;
        }

        state.page =
          Number(result.page || 1);

        const items =
          Array.isArray(result.items)
            ? result.items
            : [];

        const totalItems =
          Number(
            result.totalItems || 0
          );

        if (count) {
          count.textContent =
            totalItems +
            (
              totalItems === 1
                ? ' record'
                : ' records'
            );
        }

        if (!items.length) {
          if (empty) {
            empty.style.display =
              'block';
            empty.textContent =
              result.message ||
              'No records found.';
          }
          return;
        }

        if (empty) {
          empty.style.display =
            'none';
        }

        if (tableBody) {
          tableBody.innerHTML =
            items
              .map(rowRenderer)
              .join('');
        }

        if (tableArea) {
          tableArea.style.display =
            'block';
        }

        const start =
          (state.page - 1) *
          WORKFLOW_PAGE_SIZE + 1;

        const end =
          Math.min(
            start +
            items.length - 1,
            totalItems
          );

        if (pageSummary) {
          pageSummary.textContent =
            'Showing ' +
            start +
            '–' +
            end +
            ' of ' +
            totalItems;
        }

        renderWorkflowPagination_(
          prefix,
          Number(result.page || 1),
          Number(
            result.totalPages || 1
          ),
          Boolean(
            result.hasPrevious
          ),
          Boolean(
            result.hasNext
          ),
          pageLoader
        );

        if (pagination) {
          pagination.style.display =
            'flex';
        }
      }


      function renderWorkflowPagination_(
        prefix,
        page,
        totalPages,
        hasPrevious,
        hasNext,
        pageLoader
      ) {
        const container =
          document.getElementById(
            prefix + 'PageButtons'
          );

        if (!container) {
          return;
        }

        container.innerHTML = '';

        function addButton(
          label,
          targetPage,
          disabled,
          active
        ) {
          const button =
            document.createElement(
              'button'
            );

          button.type = 'button';
          button.className =
            'page-button' +
            (
              active
                ? ' active'
                : ''
            );

          button.textContent = label;
          button.disabled =
            Boolean(disabled);

          if (!disabled) {
            button.addEventListener(
              'click',
              function() {
                pageLoader(
                  targetPage
                );
              }
            );
          }

          container.appendChild(
            button
          );
        }

        addButton(
          'Previous',
          page - 1,
          !hasPrevious,
          false
        );

        const start =
          Math.max(1, page - 2);

        const end =
          Math.min(
            totalPages,
            page + 2
          );

        for (
          let current = start;
          current <= end;
          current++
        ) {
          addButton(
            String(current),
            current,
            current === page,
            current === page
          );
        }

        addButton(
          'Next',
          page + 1,
          !hasNext,
          false
        );
      }


      function initializeWorkflowQueues_() {
        const paymentBackLink =
          document.getElementById(
            'dashboardPaymentsBackLink'
          );

        if (paymentBackLink) {
          paymentBackLink.href =
            ADMIN_DASHBOARD_BASE_URL +
            '?view=dashboard&section=payments&session=' +
            encodeURIComponent(ADMIN_SESSION_TOKEN);
        }

        const paymentsSearch =
          document.getElementById(
            'paymentsSearch'
          );

        if (paymentsSearch) {
          if (
            String(
              DASHBOARD_APPLICATION_ID ||
              ''
            ).trim()
          ) {
            loadDashboardPaymentDetail_(
              DASHBOARD_APPLICATION_ID
            );
            return;
          }

          paymentsSearch.addEventListener(
            'keydown',
            function(event) {
              if (event.key === 'Enter') {
                event.preventDefault();
                applyPaymentFilters();
              }
            }
          );

          loadPaymentsPage();
        }

        const licencesSearch =
          document.getElementById(
            'licencesSearch'
          );

        if (licencesSearch) {
          const licenceBackLink =
            document.getElementById(
              'dashboardLicencesBackLink'
            );

          if (licenceBackLink) {
            licenceBackLink.href =
              ADMIN_DASHBOARD_BASE_URL +
              '?view=dashboard&section=licences&session=' +
              encodeURIComponent(ADMIN_SESSION_TOKEN);
          }

          if (
            String(
              DASHBOARD_APPLICATION_ID ||
              ''
            ).trim()
          ) {
            loadDashboardLicenceDetail_(
              DASHBOARD_APPLICATION_ID
            );
            return;
          }

          licencesSearch.addEventListener(
            'keydown',
            function(event) {
              if (event.key === 'Enter') {
                event.preventDefault();
                applyLicenceFilters();
              }
            }
          );

          loadLicencesPage();
        }
      }


      function initializeApplicationsSection_() {
        const backLink =
          document.getElementById(
            'dashboardApplicationsBackLink'
          );

        if (backLink) {
          backLink.href =
            ADMIN_DASHBOARD_BASE_URL +
            '?view=dashboard&section=applications' +
            '&session=' +
            encodeURIComponent(
              ADMIN_SESSION_TOKEN
            );
        }

        const search =
          document.getElementById(
            'applicationsSearch'
          );

        if (!search) {
          return;
        }

        if (
          String(
            DASHBOARD_APPLICATION_ID ||
            ''
          ).trim()
        ) {
          loadDashboardApplicationDetail_(
            DASHBOARD_APPLICATION_ID
          );
          return;
        }

        search.addEventListener(
          'keydown',
          function(event) {
            if (event.key === 'Enter') {
              event.preventDefault();
              applyApplicationFilters();
            }
          }
        );

        loadApplicationsPage();
      }


      function toggleDashboardPassword(
        inputId,
        button
      ) {
        const input =
          document.getElementById(
            inputId
          );

        if (!input) {
          return;
        }

        const showing =
          input.type === 'text';

        input.type =
          showing
            ? 'password'
            : 'text';

        if (button) {
          button.setAttribute(
            'aria-label',
            showing
              ? 'Show password'
              : 'Hide password'
          );

          button.textContent =
            showing
              ? '👁'
              : '🙈';
        }
      }

      function getErrorMessage_(error) {
        if (error && error.message) {
          return error.message;
        }

        return String(error || 'Something went wrong.');
      }

      function submitAdminLogin(event) {
        event.preventDefault();

        const email = document.getElementById('adminLoginEmail').value.trim();
        const password = document.getElementById('adminLoginPassword').value;
        const button = document.getElementById('adminLoginButton');
        const message = document.getElementById('adminLoginMessage');

        button.disabled = true;
        button.textContent = 'Signing In...';
        message.className = 'auth-message';
        message.textContent = '';

        google.script.run
          .withSuccessHandler(function(result) {
            if (!result || result.ok !== true) {
              button.disabled = false;
              button.textContent = 'Sign In';
              message.className = 'auth-message error';
              message.textContent =
                result && result.message
                  ? result.message
                  : 'Unable to sign in.';
              return;
            }

            navigateToDashboard_(result.sessionToken);
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            button.textContent = 'Sign In';
            message.className = 'auth-message error';
            message.textContent = getErrorMessage_(error);
          })
          .adminLogin(email, password);
      }

      function submitAdminPasswordChange(event) {
        event.preventDefault();

        const currentPassword = document.getElementById('adminCurrentPassword').value;
        const newPassword = document.getElementById('adminNewPassword').value;
        const confirmPassword = document.getElementById('adminConfirmPassword').value;
        const button = document.getElementById('adminPasswordChangeButton');
        const message = document.getElementById('adminPasswordChangeMessage');

        button.disabled = true;
        button.textContent = 'Changing Password...';
        message.className = 'auth-message';
        message.textContent = '';

        google.script.run
          .withSuccessHandler(function(result) {
            if (!result || result.ok !== true) {
              button.disabled = false;
              button.textContent = 'Change Password';
              message.className = 'auth-message error';
              message.textContent =
                result && result.message
                  ? result.message
                  : 'Unable to change password.';
              return;
            }

            message.className = 'auth-message success';
            message.textContent =
              result.message ||
              'Password changed successfully. Sign in with your new password.';

            button.disabled = false;
            button.type = 'button';
            button.textContent = 'Sign In';
            button.onclick = function() {
              window.top.location.href =
                ADMIN_DASHBOARD_BASE_URL +
                '?view=dashboard';
            };
          })
          .withFailureHandler(function(error) {
            button.disabled = false;
            button.textContent = 'Change Password';
            message.className = 'auth-message error';
            message.textContent = getErrorMessage_(error);
          })
          .changeAdminPassword(
            ADMIN_SESSION_TOKEN,
            currentPassword,
            newPassword,
            confirmPassword
          );
      }

      function logoutAdmin() {
        if (!ADMIN_SESSION_TOKEN) {
          window.top.location.href =
            ADMIN_DASHBOARD_BASE_URL +
            '?view=dashboard';
          return;
        }

        google.script.run
          .withSuccessHandler(function() {
            window.top.location.href =
              ADMIN_DASHBOARD_BASE_URL +
              '?view=dashboard';
          })
          .withFailureHandler(function() {
            window.top.location.href =
              ADMIN_DASHBOARD_BASE_URL +
              '?view=dashboard';
          })
          .adminLogout(ADMIN_SESSION_TOKEN);
      }

      document.addEventListener(
        'DOMContentLoaded',
        function() {
          initializeApplicationsSection_();
          initializeWorkflowQueues_();
        }
      );

      function navigateToDashboard_(sessionToken) {
        const token = String(sessionToken || '').trim();

        if (!token) {
          return;
        }

        const url =
          ADMIN_DASHBOARD_BASE_URL +
          '?view=dashboard&session=' +
          encodeURIComponent(token);

        window.top.location.replace(url);
      }

function getDashboardCorrectionIssueText_(code) {
  const issues = {
    incomplete: 'is incomplete',
    incorrect: 'requires correction',
    mismatch: 'does not match the submitted records',
    invalid: 'appears invalid',
    missing: 'is missing',
    other: 'has another issue'
  };

  return issues[code] || code;
}

</script>
