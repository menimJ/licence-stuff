<!doctype html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f2f4f7;color:#101828}
    header{position:sticky;top:0;z-index:5;padding:12px 18px;background:#fff;border-bottom:1px solid #eaecf0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #viewer{min-height:calc(100vh - 50px);padding:18px;display:flex;flex-direction:column;align-items:center;gap:16px}
    .pdf-page{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(16,24,40,.18)}
    .image-preview{display:block;max-width:100%;max-height:calc(100vh - 86px);object-fit:contain;background:#fff}
    .message{max-width:680px;background:#fff;padding:24px;border:1px solid #eaecf0;border-radius:10px;text-align:center}
    .message h2{margin:0 0 8px}
    .message p{margin:0;color:#475467;line-height:1.55}
    .button{display:inline-block;margin-top:16px;padding:10px 14px;border:0;border-radius:8px;background:#175cd3;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}
    .muted{font-size:13px;color:#667085}
  </style>
</head>
<body>
  <header><?= documentName ?></header>
  <div id="viewer">
    <div class="message" id="loadingBox">
      <h2>Opening secure document</h2>
      <p id="statusMessage">Preparing the document for secure viewing…</p>
    </div>
  </div>

  <!-- PDF.js renders PDFs to canvas, avoiding the browser PDF plug-in inside the Apps Script sandbox. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const mimeType = <?!= JSON.stringify(mimeType) ?>;
    const base64Data = <?!= JSON.stringify(base64Data) ?>;
    const documentName = <?!= JSON.stringify(documentName) ?>;

    function decodeBase64Bytes_() {
      const binary = atob(base64Data || '');
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function makeBlobUrl_(bytes) {
      return URL.createObjectURL(new Blob([bytes], {
        type: mimeType || 'application/octet-stream'
      }));
    }

    function showError_(message, blobUrl) {
      const viewer = document.getElementById('viewer');
      viewer.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'message';
      box.innerHTML = '<h2>Preview unavailable</h2><p></p>';
      box.querySelector('p').textContent = message || 'The document could not be displayed in this browser.';
      if (blobUrl) {
        const link = document.createElement('a');
        link.className = 'button';
        link.href = blobUrl;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'Open PDF in Browser';
        box.appendChild(link);
      }
      viewer.appendChild(box);
    }

    async function renderPdf_(bytes) {
      if (!window.pdfjsLib) {
        throw new Error('The secure PDF renderer could not be loaded.');
      }

      // No worker is needed for these relatively small admin documents. This also
      // avoids worker/CSP issues inside Google Apps Script HTML Service.
      const loadingTask = pdfjsLib.getDocument({data: bytes, disableWorker: true});
      const pdf = await loadingTask.promise;
      const viewer = document.getElementById('viewer');
      viewer.innerHTML = '';

      const maxWidth = Math.max(320, Math.min(window.innerWidth - 36, 1100));

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        const page = await pdf.getPage(pageNumber);
        const baseViewport = page.getViewport({scale: 1});
        const scale = Math.min(2, maxWidth / baseViewport.width);
        const viewport = page.getViewport({scale: scale});

        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        canvas.setAttribute('aria-label', 'Page ' + pageNumber + ' of ' + pdf.numPages);
        viewer.appendChild(canvas);

        await page.render({
          canvasContext: canvas.getContext('2d'),
          viewport: viewport
        }).promise;
      }

      if (!pdf.numPages) {
        throw new Error('The PDF does not contain any pages.');
      }
    }

    async function initialiseViewer_() {
      let bytes;
      let blobUrl = '';

      try {
        bytes = decodeBase64Bytes_();
        blobUrl = makeBlobUrl_(bytes);
        const normalizedMime = String(mimeType || '').toLowerCase();

        if (normalizedMime === 'application/pdf') {
          await renderPdf_(bytes);
          return;
        }

        if (normalizedMime.indexOf('image/') === 0) {
          const viewer = document.getElementById('viewer');
          viewer.innerHTML = '';
          const image = document.createElement('img');
          image.className = 'image-preview';
          image.src = blobUrl;
          image.alt = documentName || 'Secure document';
          viewer.appendChild(image);
          return;
        }

        showError_('This file type cannot be previewed in the browser.', blobUrl);
      } catch (error) {
        showError_(
          error && error.message ? String(error.message) : 'The secure document could not be displayed.',
          blobUrl
        );
      }
    }

    initialiseViewer_();
  </script>
</body>
</html>
