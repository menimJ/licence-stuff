<!doctype html><html><head><base target="_top"><meta charset="utf-8"><style>body{margin:0;background:#f4f6f8;color:#17202a;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:70px auto;padding:0 20px}.card{padding:32px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 8px 30px rgba(16,24,40,.06)}.eyebrow{color:#667085;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:8px 0}p{color:#667085}form{display:flex;gap:10px;margin-top:24px}input{min-width:0;flex:1;padding:12px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}button{padding:12px 16px;border:0;border-radius:8px;background:#183b56;color:#fff;font-weight:700;cursor:pointer}.result{display:none;margin-top:22px;padding:18px;border:1px solid #e4e7ec;border-radius:10px}.result.valid{background:#ecfdf3;color:#027a48}.result.invalid{background:#fef3f2;color:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;color:#17202a}.grid span{display:block;color:#667085;font-size:11px;font-weight:700;text-transform:uppercase}.grid strong{display:block;margin-top:3px;font-size:14px}@media(max-width:520px){form{flex-direction:column}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><div class="eyebrow">Council for the Regulation of Freight Forwarding in Nigeria</div><h1>CRFFN Licence Verification</h1><p>Enter a CRFFN licence number to verify its current validity.</p><form onsubmit="verifyLicence(event)"><input id="licenceNumber" required placeholder="Licence Number" autocomplete="off"><button id="verifyButton">Verify Licence</button></form><div id="result" class="result" aria-live="polite"></div></section></main><script>function esc(v){return String(v||'—').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function verifyLicence(e){e.preventDefault();var n=document.getElementById('licenceNumber').value.trim(),b=document.getElementById('verifyButton'),r=document.getElementById('result');b.disabled=true;b.textContent='Verifying...';google.script.run.withSuccessHandler(function(x){b.disabled=false;b.textContent='Verify Licence';r.style.display='block';if(!x.valid){r.className='result invalid';r.innerHTML='<strong>✕ Licence Not Found</strong><p>'+esc(x.message)+'</p>';return}r.className='result valid';r.innerHTML='<strong>✓ Licence Verified</strong><div class="grid"><div><span>Licence Number</span><strong>'+esc(x.licence_number)+'</strong></div><div><span>Status</span><strong>'+esc(x.status)+'</strong></div><div><span>Company Name</span><strong>'+esc(x.company_name)+'</strong></div><div><span>Licence Type</span><strong>'+esc(x.licence_type)+'</strong></div><div><span>Issued Date</span><strong>'+esc(x.issued_date)+'</strong></div><div><span>Expiry Date</span><strong>'+esc(x.expiry_date)+'</strong></div></div>'}).withFailureHandler(function(){b.disabled=false;b.textContent='Verify Licence';r.style.display='block';r.className='result invalid';r.textContent='Unable to verify this licence right now.'}).verifyPublicLicence(n)}</script></body></html>
