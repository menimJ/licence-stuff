    <style>
      :root {
        --background: #f4f6f8;
        --surface: #ffffff;
        --primary: #183b56;
        --primary-hover: #102a40;
        --text-primary: #17202a;
        --text-secondary: #667085;
        --border: #e4e7ec;
        --danger-background: #fef3f2;
        --danger-text: #b42318;
        --success-background: #ecfdf3;
        --success-text: #027a48;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text-primary);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      button, input { font: inherit; }

      .auth-page {
        min-height: 100vh;
        padding: 32px 20px;
        display: grid;
        place-items: center;
      }

      .auth-card {
        width: 100%;
        max-width: 520px;
        padding: 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(16, 24, 40, 0.08);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1, h2, p { margin-top: 0; }
      .muted { color: var(--text-secondary); }

      .auth-form {
        display: grid;
        gap: 16px;
        margin-top: 22px;
      }

      .auth-form label {
        display: grid;
        gap: 7px;
        font-size: 13px;
        font-weight: 700;
      }

      .auth-form input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #ffffff;
        color: var(--text-primary);
      }

      .auth-form input:focus {
        border-color: var(--primary);
        outline: 2px solid rgba(24, 59, 86, 0.12);
      }

      .password-field {
        position: relative;
        display: block;
      }

      .password-field input {
        padding-right: 48px;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        padding: 0;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #475467;
        cursor: pointer;
        line-height: 1;
      }

      .password-toggle:hover {
        background: #f2f4f7;
      }

      .button {
        min-height: 42px;
        padding: 9px 14px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      .button:hover { background: var(--primary-hover); }
      .button:disabled { opacity: 0.65; cursor: wait; }

      .button-danger {
        background: #b42318;
      }

      .button-danger:hover {
        background: #912018;
      }

      .auth-message {
        display: none;
        padding: 11px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .auth-message.error {
        display: block;
        background: var(--danger-background);
        color: var(--danger-text);
      }

      .auth-message.success {
        display: block;
        background: var(--success-background);
        color: var(--success-text);
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
      }

      .sidebar {
        min-height: 100vh;
        padding: 24px 16px;
        background: var(--primary);
        color: #ffffff;
      }

      .brand {
        padding: 0 10px 22px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      }

      .brand-title { margin: 0; font-size: 18px; }

      .brand-subtitle {
        margin: 4px 0 0;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
      }

      .nav {
        display: grid;
        gap: 5px;
        margin-top: 22px;
      }

      .nav-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 42px;
        padding: 9px 11px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.82);
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
      }

      .nav-link:hover, .nav-link.active {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }

      .nav-link.disabled {
        cursor: default;
        opacity: 0.58;
      }

      .coming-soon {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .main { min-width: 0; }

      .topbar {
        min-height: 72px;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: #ffffff;
        border-bottom: 1px solid var(--border);
      }

      .page-title { margin: 0; font-size: 22px; }

      .admin-meta {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .admin-identity {
        color: var(--text-secondary);
        font-size: 12px;
        text-align: right;
      }

      .logout-button {
        padding: 8px 11px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #ffffff;
        color: #344054;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .content { padding: 26px 24px 50px; }

      .welcome-card {
        padding: 24px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(16, 24, 40, 0.04);
      }

      .menu-note {
        margin-top: 18px;
        padding: 13px 14px;
        border-radius: 8px;
        background: #f8fafc;
        color: var(--text-secondary);
        font-size: 13px;
      }

      .applications-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      .applications-toolbar {
        padding: 20px;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) 190px auto;
        gap: 12px;
        align-items: end;
        border-bottom: 1px solid var(--border);
      }

      .applications-toolbar label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
      }

      .applications-toolbar input,
      .applications-toolbar select {
        min-height: 42px;
        width: 100%;
        padding: 9px 11px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        background: #fff;
      }

      .applications-summary {
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--text-secondary);
        font-size: 13px;
        border-bottom: 1px solid var(--border);
      }

      .applications-table-wrap { overflow-x: auto; }

      .applications-table {
        width: 100%;
        min-width: 1000px;
        border-collapse: collapse;
      }

      .applications-table th,
      .applications-table td {
        padding: 13px 14px;
        border-bottom: 1px solid #eaecf0;
        text-align: left;
        font-size: 13px;
      }

      .applications-table th {
        background: #f9fafb;
        color: #475467;
        font-size: 11px;
        text-transform: uppercase;
      }

      .application-primary { font-weight: 700; }

      .status-pill {
        display: inline-flex;
        padding: 4px 8px;
        border-radius: 999px;
        background: #f2f4f7;
        color: #344054;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .status-pill.success { background: #ecfdf3; color: #027a48; }
      .status-pill.warning { background: #fffaeb; color: #b54708; }
      .status-pill.danger { background: #fef3f2; color: #b42318; }

      .review-link {
        display: inline-flex;
        padding: 7px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        color: #344054;
        background: #fff;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .applications-state {
        padding: 34px 20px;
        color: var(--text-secondary);
        text-align: center;
      }

      .pagination {
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--border);
      }

      .pagination-controls {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }

      .page-button {
        min-width: 36px;
        min-height: 36px;
        padding: 6px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        background: #fff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .page-button.active {
        background: var(--primary);
        color: #fff;
      }

      .page-button:disabled {
        opacity: .45;
        cursor: not-allowed;
      }


      .dashboard-detail-card {
        margin-bottom: 18px;
        padding: 20px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .dashboard-detail-header {
        margin-bottom: 18px;
        padding: 20px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .dashboard-stage-workspace {
        display: grid;
        grid-template-columns: minmax(240px, 280px) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .dashboard-stage-status {
        position: sticky;
        top: 18px;
        padding: 20px;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .dashboard-stage-status h3 { margin: 0 0 18px; }

      .dashboard-stage-status-item {
        display: grid;
        gap: 7px;
        padding: 13px 0;
        border-top: 1px solid #eaecf0;
      }

      .dashboard-document-progress {
        display: grid;
        gap: 6px;
        margin-top: 10px;
        padding-top: 14px;
        border-top: 1px solid #eaecf0;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 600;
      }

      .dashboard-review-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid #eaecf0;
      }

      .dashboard-review-note {
        display: block;
        margin-top: 7px;
        color: var(--text-secondary);
        font-size: 13px;
      }

      .dashboard-detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .dashboard-information-section + .dashboard-information-section {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px solid #eaecf0;
      }

      .dashboard-information-section h4 {
        margin: 0 0 12px;
        color: var(--text-primary);
        font-size: 14px;
      }

      .dashboard-detail-field {
        padding: 12px;
        border: 1px solid #eaecf0;
        border-radius: 8px;
        background: #f9fafb;
      }

      .dashboard-detail-field.full {
        grid-column: 1 / -1;
      }

      .dashboard-detail-label {
        display: block;
        margin-bottom: 4px;
        color: var(--text-secondary);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .dashboard-detail-value {
        font-size: 13px;
        font-weight: 600;
        word-break: break-word;
      }

      .dashboard-status-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .dashboard-back-link {
        display: inline-block;
        margin-bottom: 14px;
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .dashboard-doc-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        margin-bottom: 9px;
        border: 1px solid #eaecf0;
        border-radius: 8px;
      }

      .dashboard-document-status { margin: 7px 0; }

      .dashboard-document-review-actions { width: 100%; }

      .dashboard-doc-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .dashboard-detail-link {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        background: #ffffff;
        color: #344054;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .dashboard-review-dialog {
        position: fixed;
        z-index: 20;
        inset: 0;
        place-items: center;
        padding: 20px;
        background: rgba(16, 24, 40, 0.45);
      }

      .dashboard-review-dialog-card {
        display: grid;
        gap: 14px;
        width: min(100%, 520px);
        padding: 22px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 16px 40px rgba(16, 24, 40, 0.2);
      }

      .dashboard-review-dialog-card h3 { margin: 0; }

      .dashboard-review-dialog-card label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
      }

      .dashboard-review-dialog-card select,
      .dashboard-review-dialog-card textarea {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        font: inherit;
      }

      @media (max-width: 850px) {
        .dashboard-stage-workspace { grid-template-columns: 1fr; }
        .dashboard-stage-status { position: static; }

        .dashboard-status-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 650px) {
        .dashboard-detail-grid,
        .dashboard-status-grid {
          grid-template-columns: 1fr;
        }

        .dashboard-detail-field.full {
          grid-column: auto;
        }

        .dashboard-doc-row {
          align-items: flex-start;
          flex-direction: column;
        }

        .dashboard-review-actions {
          align-items: stretch;
          flex-direction: column;
        }
      }

      @media (max-width: 900px) {
        .applications-toolbar {
          grid-template-columns: 1fr 1fr;
        }

        .applications-toolbar .button {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 620px) {
        .applications-toolbar {
          grid-template-columns: 1fr;
        }

        .applications-toolbar .button {
          grid-column: auto;
        }

        .applications-summary,
        .pagination {
          flex-direction: column;
        }
      }

      @media (max-width: 800px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar { min-height: auto; }
        .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .topbar { align-items: flex-start; flex-direction: column; }
        .admin-meta { width: 100%; justify-content: space-between; }
        .admin-identity { text-align: left; }
      }

      @media (max-width: 520px) {
        .nav { grid-template-columns: 1fr; }
        .content, .topbar { padding-left: 16px; padding-right: 16px; }
      }
    </style>
